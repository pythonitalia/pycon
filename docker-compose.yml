x-defaults:
  environment: &enviroment_defaults
    DEBUG: "True"
    NODE_ENV: "development"
    ENV: "local"
    CONFERENCE_CODE: ${CONFERENCE_CODE:-pycon2023}
    PLAIN_API: https://core-api.uk.plain.com/graphql/v1
    SECRET_KEY: secret-key
    API_URL: /graphql
    API_URL_SERVER: http://backend:8000
    # Stripe
    STRIPE_SUBSCRIPTION_PRICE_ID: price_1IkVzxD5MZ3GejSORRBZCvK6
    # URLs
    ASSOCIATION_FRONTEND_URL: http://localhost:3020
    # stripe
    PRETIX_WEBHOOK_SECRET: "secret"
  pycon_backend_envs: &pycon_backend_envs
    <<: *enviroment_defaults
    CACHE_URL: redis://redis:6379/0
    DATABASE_URL: psql://pycon:pycon@backend-db/pycon
    ALLOWED_HOSTS: "*"
    MEDIA_FILES_STORAGE_BACKEND: ${MEDIA_FILES_STORAGE_BACKEND:-pycon.storages.CustomFileSystemStorage}
    MEDIA_FILES_PRIVATE_STORAGE_BACKEND: ${MEDIA_FILES_PRIVATE_STORAGE_BACKEND:-pycon.storages.CustomFileSystemStorage}
    CELERY_BROKER_URL: redis://redis:6379/9
    CELERY_RESULT_BACKEND: redis://redis:6379/10
    CLAMAV_HOST: clamav
    CLAMAV_PORT: 3310
    PRETIX_API: ${LOCAL_PRETIX_API:-http://pretix/api/v1/}
    PRETIX_API_HOST: ${LOCAL_PRETIX_API_HOST:-localhost:8345}
    PRETIX_API_TOKEN: ${LOCAL_PRETIX_API_TOKEN:-local-dashboard-api-token}

services:
  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.python.local
    networks: [pycon_net]
    restart: unless-stopped
    command: sh -c "export DJANGO_SETTINGS_MODULE=pycon.settings.dev &&
      uv sync &&
      pnpm --dir dashboard install --frozen-lockfile &&
      uv run python manage.py migrate &&
      uv run python manage.py create_admin &&
      touch /.ready &&
      uv run python manage.py runserver 0.0.0.0:8000"
    depends_on:
      redis:
        condition: service_healthy
      backend-db:
        condition: service_healthy
    tty: true
    stdin_open: true
    ports:
      - 8000:8000
      - 5173:5173
    volumes:
      - ./backend:/home/app/
      - /.venv/
      - /home/app/dashboard/node_modules/
    environment:
      <<: *pycon_backend_envs
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "test -f /.ready"]
      interval: 10s
      timeout: 10s
      retries: 10

  custom-admin:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.node.local
    networks: [pycon_net]
    restart: unless-stopped
    entrypoint: ""
    working_dir: /home/node/app/custom_admin/
    command: sh -c "pnpm install --config.confirmModulesPurge=false && touch /.ready && pnpm run dev"
    volumes:
      - ./backend:/home/node/app
      - /home/node/app/node_modules/
    environment:
      <<: *enviroment_defaults
      ADMIN_GRAPHQL_URL: http://backend:8000/admin/graphql
    env_file:
      - .env
    tty: true
    stdin_open: true
    ports:
      - 3002:3002
      - 3003:3003
    healthcheck:
      test: ["CMD-SHELL", "test -f /.ready"]
      interval: 10s
      timeout: 10s
      retries: 10
    depends_on:
      backend:
        condition: service_healthy

  backend-db:
    image: postgres:14.5
    networks: [pycon_net]
    restart: unless-stopped
    ports:
      - "15501:5432"
    volumes:
      - pycon-backend-db-data:/var/lib/postgresql/data
      - ./db-superuser.sql:/docker-entrypoint-initdb.d/db-superuser.sql
    environment:
      POSTGRES_USER: pycon
      POSTGRES_PASSWORD: pycon
      POSTGRES_DB: pycon
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pycon"]
      interval: 5s
      timeout: 5s

  pretix:
    profiles: [pretix]
    build:
      context: ./pretix
    networks: [pycon_net]
    restart: unless-stopped
    depends_on:
      pretix-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8345:80"
    volumes:
      - pycon-pretix-data:/data
    environment:
      DATA_DIR: /data
      DJANGO_SETTINGS_MODULE: production_settings
      PRETIX_CELERY_BACKEND: redis://redis:6379/13
      PRETIX_CELERY_BROKER: redis://redis:6379/12
      PRETIX_DATABASE_BACKEND: postgresql
      PRETIX_DATABASE_HOST: pretix-db
      PRETIX_DATABASE_NAME: pretix
      PRETIX_DATABASE_PASSWORD: pretix
      PRETIX_DATABASE_PORT: 5432
      PRETIX_DATABASE_USER: pretix
      PRETIX_DJANGO_SECRET: local-pretix-secret-key
      PRETIX_LOCALE_DEFAULT: en
      PRETIX_LOCALE_TIMEZONE: Europe/Rome
      PRETIX_PRETIX_CURRENCY: EUR
      PRETIX_PRETIX_INSTANCE_NAME: PyCon Italia local
      PRETIX_PRETIX_URL: http://localhost:8345
      PRETIX_PYCON_MEDIA_BUCKET_NAME: ""
      PRETIX_REDIS_LOCATION: redis://redis:6379/11
      PRETIX_REDIS_SESSIONS: "false"
      PYCON_LOCAL_PRETIX_TOKEN: ${LOCAL_PRETIX_API_TOKEN:-local-dashboard-api-token}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent --header 'Host: localhost:8345' http://127.0.0.1/healthcheck/ > /dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  pretix-db:
    profiles: [pretix]
    image: postgres:14.5
    networks: [pycon_net]
    restart: unless-stopped
    ports:
      - "127.0.0.1:15502:5432"
    volumes:
      - pycon-pretix-db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: pretix
      POSTGRES_PASSWORD: pretix
      POSTGRES_USER: pretix
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pretix"]
      interval: 5s
      timeout: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.node.local
    networks: [pycon_net]
    restart: unless-stopped
    entrypoint: ""
    working_dir: /home/node/app
    command: sh -c "pnpm install && pnpm codegen && pnpm run dev"
    volumes:
      - ./frontend/:/home/node/app
      - /home/node/app/.pnpm-store/
      - /home/node/app/node_modules/
      - /home/node/app/.next
    environment:
      <<: *enviroment_defaults
      CMS_HOSTNAME: localhost:3000
      CMS_ADMIN_HOST: localhost:8000
    env_file:
      - .env
    tty: true
    stdin_open: true
    ports:
      - 3000:3000
    depends_on:
      backend:
        condition: service_healthy

  redis:
    image: redis:6
    networks: [pycon_net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]

  clamav:
    image: clamav/clamav:stable
    platform: linux/amd64
    networks: [pycon_net]
    restart: unless-stopped


networks:
  pycon_net:

volumes:
  pycon-backend-db-data:
  pycon-pretix-data:
  pycon-pretix-db-data:
