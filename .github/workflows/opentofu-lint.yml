on:
  pull_request:
    paths:
      - "infrastructure/applications/**/*"
      - "infrastructure/applications/*"

name: OpenTofu Lint

env:
  TF_WORKSPACE: "production"

jobs:
  tfsec:
    name: TFSec
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Clone repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: tfsec
        uses: aquasecurity/tfsec-pr-commenter-action@1015a3975c7f1400ee4d9f423a7786a3df9fcbec # v1.2.0
        with:
          github_token: ${{ github.token }}

  lint:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1.0.8
        with:
          tofu_version: 1.9.0
      - name: OpenTofu Format
        id: fmt
        run: tofu fmt -check
        env:
          TF_IN_AUTOMATION: 1
