name: Backend tests

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "backend/**/*"
      - "backend/*"
      - ".github/workflows/backend-test.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:14.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432/tcp
        # needed because the postgres container does not provide a healthcheck
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7.2.3
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.7"
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        id: setup-uv
        with:
          version: "0.12.5"
          enable-cache: true
      - run: pip install codecov
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libharfbuzz-subset0

      - name: Install python dependencies
        if: steps.setup-uv.outputs.cache-hit != 'true'
        run: uv sync

      - name: pytest
        run: |
          set +e
          CPUS=$(nproc --all)
          OUTPUT=$(uv run pytest --cov-report xml --cov=. --cov-fail-under 80 --durations 10 -n $CPUS)
          STATUS=$?
          echo "$OUTPUT"
          cd ..
          codecov
          exit $STATUS
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:${{ job.services.postgres.ports['5432'] }}/postgres
          CACHE_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://redis:6379/1
          CELERY_RESULT_BACKEND: redis://redis:6379/2
          STRIPE_SECRET_API_KEY: fake-key
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
          MEDIA_FILES_STORAGE_BACKEND: django.core.files.storage.FileSystemStorage
          STRIPE_SUBSCRIPTION_PRICE_ID: ""
          STRIPE_WEBHOOK_SIGNATURE_SECRET: ""
