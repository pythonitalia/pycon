name: GraphQL schema

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/graphql-schema.yml"

permissions:
  contents: read
  checks: write
  pull-requests: read

jobs:
  schema-diff:
    name: GraphQL Inspector
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.5.5"
          enable-cache: true

      - name: Install dependencies
        working-directory: backend
        run: uv sync --locked --no-dev

      - name: Generate schema
        working-directory: backend
        run: uv run --no-sync python manage.py graphql_schema
        env:
          DJANGO_SETTINGS_MODULE: pycon.settings.test
          STRIPE_SECRET_API_KEY: ""
          STRIPE_SUBSCRIPTION_PRICE_ID: ""
          STRIPE_WEBHOOK_SIGNATURE_SECRET: ""
          CELERY_BROKER_URL: ""
          CELERY_RESULT_BACKEND: ""

      - name: Compare schema with production
        uses: graphql-hive/graphql-inspector@ea2e18d7a8e561c6f37b9f3c03af6dd0b48de004
        with:
          name: GraphQL schema
          schema: backend/schema.graphql
          endpoint: https://admin.pycon.it/graphql
          annotations: false
          fail-on-breaking: true
          experimental_merge: false
