name: GraphQL schema

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/graphql-schema.yml"

permissions:
  contents: read

jobs:
  schema-diff:
    name: GraphQL Inspector
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.5.5"
          enable-cache: true

      - name: Install dependencies
        working-directory: backend
        run: uv sync --locked --no-dev

      - name: Generate schema
        working-directory: backend
        run: uv run --no-sync python manage.py graphql_schema
        env:
          DJANGO_SETTINGS_MODULE: pycon.settings.test
          STRIPE_SECRET_API_KEY: ""
          STRIPE_SUBSCRIPTION_PRICE_ID: ""
          STRIPE_WEBHOOK_SIGNATURE_SECRET: ""
          CELERY_BROKER_URL: ""
          CELERY_RESULT_BACKEND: ""

      - name: Compare schema with production
        run: >-
          npx --yes
          --package=@graphql-inspector/cli@6.0.8
          --package=graphql@16.14.2
          graphql-inspector diff
          https://admin.pycon.it/graphql
          backend/schema.graphql
          --left-header "Content-Type: application/json"
