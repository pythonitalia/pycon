query Keynote($conference: String!, $slug: String!) {
  conference(code: $conference) {
    id
    talk(slug: $slug) {
      id
      slidoUrl
    }
    keynote(slug: $slug) {
      id
      title(language: "en")
      description(language: "en")
      slug(language: "en")
      start
      end
      youtubeVideoId
      rooms {
        id
        name
      }
      topic {
        id
        name
      }
      speakers {
        id
        fullName
        participant {
          id
          photo
          bio
          twitterHandle
          instagramHandle
          linkedinUrl
          facebookUrl
          mastodonHandle
          website
        }
      }
    }
  }
}
