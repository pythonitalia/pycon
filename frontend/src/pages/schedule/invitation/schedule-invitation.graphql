query GetScheduleInvitation($submissionId: ID!) {
  scheduleInvitation(submissionId: $submissionId) {
    id
    option
    notes
    title
    submission {
      id
      title(language: "en")
      duration {
        id
        duration
      }
    }
    dates {
      id
      start
      end
      duration
    }
  }
}
