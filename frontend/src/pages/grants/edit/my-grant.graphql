query MyGrant($conference: String!) {
  me {
    id

    grant(conference: $conference) {
      id
      status
      fullName
      name
      gender
      grantType
      occupation
      needsFundsForTravel
      needVisa
      needAccommodation
      departureCountry
      nationality
      departureCity
      formAnswers
    }
  }
}
