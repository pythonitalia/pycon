#import "../../fragments/schedule-item.graphql"

query ParticipantPublicProfile($id: ID!, $conference: String!) {
  participant(id: $id, conference: $conference) {
    id
    fullname
    publicProfile
    bio
    website
    photo
    twitterHandle
    instagramHandle
    linkedinUrl
    facebookUrl
    mastodonHandle
    proposals {
      id
      title(language: "en")
      type {
        id
        name
      }
      audienceLevel {
        id
        name
      }
      duration {
        id
        duration
      }
      scheduleItems {
        ...ScheduleItemFragment
      }
    }
  }
}
