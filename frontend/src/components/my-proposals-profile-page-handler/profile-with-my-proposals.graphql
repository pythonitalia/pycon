query MyProfileWithSubmissions($conference: String!) {
  me {
    id
    name
    fullName
    email

    submissions(conference: $conference) {
      id
      title(language: "en")
      status

      scheduleItems {
        id
        start
        end
        status
      }
      type {
        id
        name
      }
    }
  }

  conference(code: $conference) {
    id
    deadline(type: "cfp") {
      id
      status
    }
  }
}
