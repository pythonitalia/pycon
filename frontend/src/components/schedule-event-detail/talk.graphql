query Talk($slug: String!, $code: String!) {
  conference(code: $code) {
    id
    talk(slug: $slug) {
      id
      title
      type
      image
      highlightColor
      description
      hasLimitedCapacity
      spacesLeft
      hasSpacesLeft
      slidoUrl
      youtubeVideoId

      abstract
      elevatorPitch

      start
      end

      rooms {
        id
        name
      }

      language {
        code
      }

      submission {
        id
        abstract(language: "en")
        elevatorPitch(language: "en")

        duration {
          id
          duration
        }

        audienceLevel {
          id
          name
        }

        topic {
          name
        }

        tags {
          name
          id
        }

        materials {
          id
          name
          url
          fileUrl
          fileMimeType
        }
      }

      speakers {
        id
        fullName
        participant {
          id
          photo
          bio
          twitterHandle
          instagramHandle
          linkedinUrl
          facebookUrl
          mastodonHandle
          website
        }
      }
    }
  }
}
