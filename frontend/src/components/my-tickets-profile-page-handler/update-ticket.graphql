mutation UpdateTicket(
  $conference: String!
  $input: UpdateAttendeeTicketInput!
) {
  __typename
  updateAttendeeTicket(conference: $conference, input: $input, language: "en") {
    __typename

    ... on AttendeeTicket {
      id
      attendeeName {
        scheme
        parts
      }
      attendeeEmail
      item {
        id
        name
        language
        description
        category
        questions {
          id
          answer {
            answer
            options
          }
          name
          options {
            id
            name
          }
        }
      }
    }

    ... on TicketReassigned {
      id
      attendeeEmail
    }

    ... on UpdateAttendeeTicketErrors {
      errors {
        id
        attendeeName {
          givenName
          familyName
          nonFieldErrors
        }
        attendeeEmail
        answers {
          answer
          question
          options
          nonFieldErrors
          __typename
        }
      }
    }
  }
}
