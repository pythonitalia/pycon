query MyProfileWithTickets($conference: String!) {
  conference(code: $conference) {
    id
    badgePreviewDeadline: deadline(type: "badge_preview") {
      id
      status
    }
  }

  me {
    id
    name
    fullName
    email

    tickets(conference: $conference, language: "en") {
      id
      hashid
      attendeeName {
        scheme
        parts
      }
      attendeeEmail
      secret
      variation
      role
      item {
        id
        name
        language
        description
        category
        admission
        variations {
          id
          value
        }
        questions {
          id
          hidden
          answer {
            answer
            options
          }
          name
          options {
            id
            name
          }
        }
      }
    }
  }
}
