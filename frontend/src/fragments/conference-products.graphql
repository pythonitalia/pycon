fragment ConferenceProducts on Conference {
  id
  start
  end
  timeZone: timezone
  pretixEventUrl

  tickets(language: "en") {
    id
    language
    name
    description
    defaultPrice
    availableUntil
    quantityLeft
    soldOut
    type
    category
    categoryInternalName
    taxRate
    admission

    variations {
      id
      defaultPrice
      value
      soldOut
      active
      description
    }

    questions {
      id
      name
      required
      hidden
      options {
        id
        name
      }
    }
  }
}
